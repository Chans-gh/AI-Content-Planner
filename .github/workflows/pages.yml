# 发布介绍页到 GitHub Pages：合并到 main 后把 site/ 整个目录传上去
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查页面是自包含的（没有外部 http(s) 资源）
        run: |
          if grep -nE 'src="https?://|href="https?://[^"]*\.(css|js)' site/index.html; then
            echo "页面里引用了外部资源，介绍页必须自包含" >&2
            exit 1
          fi

      # 裁字体：只装 page 用到的几个 @fontsource 包（版本写在 site/build-fonts.py 里），装在仓库外面
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - id: font-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fontsrc/node_modules
          key: fontsrc-${{ hashFiles('site/build-fonts.py') }}
      - name: 装原字体
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/fontsrc" $(python3 site/build-fonts.py --packages)
      - name: 按页面用到的字裁成 woff2
        run: |
          pip install -q fonttools brotli
          FONTSRC="$RUNNER_TEMP/fontsrc/node_modules/@fontsource" python3 site/build-fonts.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
